<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <base href="/src/pages/">
    <title>Leaderboard</title>

    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            opacity: 0;
            transition: opacity 1s;
            position: relative;
            overflow: hidden;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            aspect-ratio: 16/9;
        }

        /* Static Bonnie background */
        #bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.55);
        }

        /* Noise overlays — same as menu */
        #animNoise {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 20;
            object-fit: contain;
            pointer-events: none;
        }

        #animWhite {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 21;
            object-fit: contain;
            pointer-events: none;
        }

        /* Slide strip — same as menu */
        .slide {
            position: fixed;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            opacity: 0.5;
            z-index: 5;
            animation: slideDown 10s linear forwards;
        }

        @keyframes slideDown {
            from { top: -100%; }
            to   { top: 90%;   }
        }

        @font-face {
            font-family: 'FNAF';
            src: url('../../assets/Fonts/five-nights-at-freddys.otf') format('opentype');
        }

        /* Title — inside container, scales with it */
        #title {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-family: 'FNAF', 'Courier New', monospace;
            font-size: 4vw;
            color: #ffffff;
            text-shadow: 2px 2px 12px rgba(0,0,0,0.95);
            white-space: nowrap;
            pointer-events: none;
        }

        #back-btn {
            position: fixed;
            top: 24px;
            left: 28px;
            z-index: 30;
            font-family: 'FNAF', 'Courier New', monospace;
            font-size: clamp(12px, 1.4vw, 20px);
            color: #ffffff;
            background: none;
            border: none;
            cursor: pointer;
            letter-spacing: 0.05em;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.9);
            white-space: nowrap;
        }
        #back-btn:hover { opacity: 0.7; }

        /* Leaderboard table — inside container, scales with it */
        #leaderboard {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-family: 'FNAF', 'Courier New', monospace;
            color: #ffffff;
            width: 82%;
            max-height: 72vh;
            overflow-y: auto;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.9);
            background: rgba(30, 30, 30, 0.55);
            padding: 1% 2%;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        #leaderboard::-webkit-scrollbar { width: 4px; }
        #leaderboard::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        #leaderboard table {
            width: 100%;
            border-collapse: collapse;
        }

        /* Night filter tabs */
        #night-tabs {
            position: absolute;
            top: 13%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 1vw;
        }
        .night-tab {
            font-family: 'FNAF', 'Courier New', monospace;
            font-size: clamp(14px, 1.8vw, 26px);
            color: rgba(255,255,255,0.45);
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 0.5% 1.4%;
            cursor: pointer;
            letter-spacing: 0.12em;
            transition: color 0.15s, border-color 0.15s;
            white-space: nowrap;
        }
        .night-tab:hover { color: rgba(255,255,255,0.8); border-color: rgba(255,255,255,0.4); }
        .night-tab.active { color: #fff; border-color: #fff; background: rgba(255,255,255,0.08); }

        #leaderboard th {
            font-size: clamp(15px, 1.9vw, 26px);
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 0.6% 1.2%;
            text-align: center;
            white-space: nowrap;
        }

        #leaderboard td {
            font-size: clamp(16px, 2vw, 28px);
            letter-spacing: 0.06em;
            color: rgba(255,255,255,0.85);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0.7% 1.2%;
            text-align: center;
        }

        td.stat { color: rgba(255,220,100,0.9); }
        td.outcome-win  { color: rgba(100,255,140,0.9); }
        td.outcome-dead { color: rgba(255,80,80,0.85); }
        th.sortable:hover { color: rgba(255,255,255,0.9) !important; }

        .slide { z-index: 22; }

        /* Fade-in from black on load */
        #page-fade {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #000;
            opacity: 1;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }
    </style>
</head>

<body>

<div id="page-fade"></div>

<div class="container">
    <img id="bg" src="../../assets/Custom/Bonnie_Menu.jpg">
    <img id="animNoise" src="../../assets/Menu/staticNoise1.png">
    <img id="animWhite" src="../../assets/Menu/whiteNoise1.png">
    <img class="slide"  src="../../assets/Menu/452.png">

    <div id="title">Security Log</div>

    <div id="night-tabs"></div>

    <div id="leaderboard">
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th></th>
                <th>Guard</th>
                <th>Night</th>
                <th>Cams</th>
                <th>Doors</th>
                <th>Power</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="lb-body">
            <tr><td colspan="8" style="opacity:0.4;padding:16px 12px;">Loading...</td></tr>
        </tbody>
    </table>
</div>

</div>

<button id="back-btn" onclick="goToMenu()">Back to Menu</button>

<script src="../data/animations.js"></script>
<script src="../pages/player.js"></script>

<script>
    function goToMenu() {
        const sfx = new Audio('../../assets/FNaF 1 Audio/CAMERA_VIDEO_LOA_60105303.wav');
        sfx.play().catch(() => {});

        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#fff;opacity:0;pointer-events:all;';
        document.body.appendChild(overlay);

        const flickers = [0.9, 0, 0.7, 0, 1, 0, 0.5, 0.8, 0, 1];
        let i = 0;
        const flicker = setInterval(() => {
            overlay.style.opacity = flickers[i] ?? 0;
            i++;
            if (i >= flickers.length) {
                clearInterval(flicker);
                overlay.style.transition = 'opacity 0.3s';
                overlay.style.background = '#000';
                overlay.style.opacity = '1';
                setTimeout(() => { window.location.href = '/menu'; }, 350);
            }
        }, 60);
    }

    window.onload = () => {
        // Fade in
        document.body.style.opacity = '1';
        const fade = document.getElementById('page-fade');
        setTimeout(() => { fade.style.opacity = '0'; }, 50);

        // Audio
        const sfxStatic = new Audio('../../assets/FNaF 1 Audio/static2.wav');
        sfxStatic.loop = true;
        sfxStatic.play().catch(() => {});

        const music = new Audio('../../assets/Custom/Bonnies Lullaby.mp3');
        music.loop = true;
        music.play().catch(() => {});

        // Start noise/white stripe overlays (same as menu)
        playNoise(document.getElementById('animNoise'), noiseMenu, 0.4);
        playNoise(document.getElementById('animNoise'), noiseMenu);
        playAnimation(document.getElementById('animWhite'), whiteMenu, 0.4);

        const API = '%VITE_API_URL%';

        function toFlag(code) {
            if (!code) return '';
            return code.toUpperCase().replace(/./g, c =>
                String.fromCodePoint(0x1F1E6 - 65 + c.charCodeAt(0))
            );
        }

        let allRows     = [];
        let activeNight = 0;   // 0 = all, -1 = custom
        let sortCol     = null;
        let sortAsc     = true;

        // column definitions — two sets depending on view
        const COLS_NORMAL = [
            { label: 'Guard',  field: 'username',       numeric: false },
            { label: 'Night',  field: 'night',          numeric: true  },
            { label: 'Cams',   field: 'cameraFlicks',   numeric: true  },
            { label: 'Doors',  field: 'doorCloses',     numeric: true  },
            { label: 'Power',  field: 'powerRemaining', numeric: true  },
            { label: 'Status', field: 'outcome',        numeric: false },
        ];
        const COLS_CUSTOM = [
            { label: 'Guard',   field: 'username',       numeric: false },
            { label: 'Freddy',  field: 'aiFreddy',       numeric: true  },
            { label: 'Bonnie',  field: 'aiBonnie',       numeric: true  },
            { label: 'Chica',   field: 'aiChica',        numeric: true  },
            { label: 'Foxy',    field: 'aiFoxy',         numeric: true  },
            { label: 'Cams',    field: 'cameraFlicks',   numeric: true  },
            { label: 'Doors',   field: 'doorCloses',     numeric: true  },
            { label: 'Power',   field: 'powerRemaining', numeric: true  },
            { label: 'Status',  field: 'outcome',        numeric: false },
        ];
        let COLS = COLS_NORMAL;

        function sortRows(rows) {
            if (!sortCol) return rows;
            return [...rows].sort((a, b) => {
                const av = a[sortCol] ?? (typeof a[sortCol] === 'number' ? -1 : '');
                const bv = b[sortCol] ?? (typeof b[sortCol] === 'number' ? -1 : '');
                const cmp = typeof av === 'number' ? av - bv : String(av).localeCompare(String(bv));
                return sortAsc ? cmp : -cmp;
            });
        }

        function updateHeaders() {
            document.querySelectorAll('th.sortable').forEach(th => {
                const active = th.dataset.field === sortCol;
                th.style.color    = active ? '#fff' : '';
                th.style.cursor   = 'pointer';
                const arrow = active ? (sortAsc ? ' ▲' : ' ▼') : ' ·';
                th.textContent = th.dataset.label + arrow;
            });
        }

        function buildHeaders() {
            const thead = document.querySelector('#leaderboard thead tr');
            thead.innerHTML =
                '<th style="opacity:0.4">#</th><th></th>' +
                COLS.map(c => `<th class="sortable" data-field="${c.field}" data-label="${c.label}">${c.label} ·</th>`).join('');
            thead.querySelectorAll('th.sortable').forEach(th => {
                th.style.cursor = 'pointer';
                th.addEventListener('click', () => {
                    if (sortCol === th.dataset.field) sortAsc = !sortAsc;
                    else { sortCol = th.dataset.field; sortAsc = true; }
                    updateHeaders();
                    renderRows();
                });
            });
        }

        function renderRows() {
            const isCustomView = activeNight === -1;
            let base;
            if (isCustomView)       base = allRows.filter(s => s.isCustomNight);
            else if (activeNight)   base = allRows.filter(s => s.night === activeNight && !s.isCustomNight);
            else                    base = allRows.filter(s => !s.isCustomNight);

            const cols  = isCustomView ? COLS_CUSTOM : COLS_NORMAL;
            const span  = 2 + cols.length; // rank + flag + cols
            const rows  = sortRows(base);
            const tbody = document.getElementById('lb-body');

            if (!rows.length) {
                tbody.innerHTML = `<tr><td colspan="${span}" style="opacity:0.4;padding:16px 12px;">No records for this selection.</td></tr>`;
                return;
            }

            tbody.innerHTML = rows.map((s, i) => {
                const isWin = s.outcome === 'win';
                const power = s.powerRemaining != null ? `${s.powerRemaining.toFixed(1)}%` : '—';
                const cams  = s.cameraFlicks ?? '—';
                const doors = s.doorCloses   ?? '—';

                let cells;
                if (isCustomView) {
                    cells = `
                        <td>${s.username}</td>
                        <td class="stat">${s.aiFreddy ?? '—'}</td>
                        <td class="stat">${s.aiBonnie ?? '—'}</td>
                        <td class="stat">${s.aiChica  ?? '—'}</td>
                        <td class="stat">${s.aiFoxy   ?? '—'}</td>
                        <td class="stat">${cams}</td>
                        <td class="stat">${doors}</td>
                        <td class="stat">${power}</td>
                        <td class="${isWin ? 'outcome-win' : 'outcome-dead'}">${isWin ? '★ survived' : '☠ got you'}</td>`;
                } else {
                    cells = `
                        <td>${s.username}</td>
                        <td style="opacity:0.7">N${s.night}</td>
                        <td class="stat">${cams}</td>
                        <td class="stat">${doors}</td>
                        <td class="stat">${power}</td>
                        <td class="${isWin ? 'outcome-win' : 'outcome-dead'}">${isWin ? '★ survived' : '☠ got you'}</td>`;
                }

                return `<tr>
                    <td style="opacity:0.4">${i + 1}</td>
                    <td style="font-size:1.3vw;">${toFlag(s.countryCode)}</td>
                    ${cells}
                </tr>`;
            }).join('');
        }

        function renderTable(nightFilter) {
            activeNight = nightFilter;
            COLS = nightFilter === -1 ? COLS_CUSTOM : COLS_NORMAL;
            document.querySelectorAll('.night-tab').forEach(t => {
                t.classList.toggle('active', parseInt(t.dataset.night) === nightFilter);
            });
            buildHeaders();
            renderRows();
        }

        function buildTabs(rows) {
            const normalRows = rows.filter(r => !r.isCustomNight);
            const hasCustom  = rows.some(r => r.isCustomNight);
            const nights     = [...new Set(normalRows.map(r => r.night))].sort((a, b) => a - b);
            const tabsEl     = document.getElementById('night-tabs');
            tabsEl.innerHTML = '';

            const allTab = document.createElement('button');
            allTab.className = 'night-tab active';
            allTab.dataset.night = 0;
            allTab.textContent = 'ALL';
            allTab.onclick = () => renderTable(0);
            tabsEl.appendChild(allTab);

            nights.forEach(n => {
                const btn = document.createElement('button');
                btn.className = 'night-tab';
                btn.dataset.night = n;
                btn.textContent = `NIGHT ${n}`;
                btn.onclick = () => renderTable(n);
                tabsEl.appendChild(btn);
            });

            if (hasCustom) {
                const customBtn = document.createElement('button');
                customBtn.className = 'night-tab';
                customBtn.dataset.night = -1;
                customBtn.textContent = 'CUSTOM';
                customBtn.style.borderColor = 'rgba(255,200,80,0.4)';
                customBtn.style.color = 'rgba(255,200,80,0.7)';
                customBtn.onclick = () => {
                    customBtn.style.color = 'rgba(255,200,80,1)';
                    renderTable(-1);
                };
                tabsEl.appendChild(customBtn);
            }
        }

        fetch(`${API}/graphql`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: `{
                leaderboard(limit: 50) {
                    username night survivedSeconds outcome country countryCode
                    cameraFlicks doorCloses powerRemaining
                    isCustomNight aiFreddy aiBonnie aiChica aiFoxy
                }
            }` })
        })
        .then(r => r.json())
        .then(({ data }) => {
            allRows = data?.leaderboard ?? [];
            const tbody = document.getElementById('lb-body');
            if (!allRows.length) {
                tbody.innerHTML = '<tr><td colspan="8" style="opacity:0.4;padding:16px 12px;">No records yet.</td></tr>';
                return;
            }
            buildHeaders();
            buildTabs(allRows);
            renderTable(0);
        })
        .catch(() => {
            document.getElementById('lb-body').innerHTML =
                '<tr><td colspan="8" style="opacity:0.4;padding:16px 12px;">[ signal lost ]</td></tr>';
        });

        // Loop slide strip
        const slide = document.querySelector('.slide');
        slide.addEventListener('animationend', () => {
            slide.style.animation = 'none';
            void slide.offsetWidth;
            slide.style.animation = 'slideDown 10s linear forwards';
        });
    };
</script>

</body>
</html>
