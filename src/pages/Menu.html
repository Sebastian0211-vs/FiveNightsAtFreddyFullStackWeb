<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <base href="/src/pages/">
    <title>FNAF 1</title>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        *:focus {
            outline: none;
        }
        body {
            background-color:black;
            margin: 0;
            height: 100vh;
            opacity: 0;
            transition: opacity 1s;
            position: relative;
            overflow: hidden;
        }

        .slide {
            position: fixed;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            opacity: 0.5;
            z-index: 5;
            animation: slideDown 10s linear forwards;
        }

        .container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            margin: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #anim {
            position: absolute;
            top:0;
            left:0;
            width: 100%;
            height: 100%;
            z-index: 1;
            object-fit: contain;
        }

        #animNoiseMenu {
            position:absolute;
            top:0;
            left:0;
            width: 100%;
            height:100%;
            z-index:2;
            object-fit: contain;
        }

        #animWhiteMenu {
            position:absolute;
            top:0;
            left:0;
            width: 100%;
            height:100%;
            z-index:3;
            object-fit: contain;
        }

        /* overlay */
        .FNAFtitle {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 15%;
            pointer-events: none;
            z-index:10;
            object-fit: contain;
        }

        .menu-buttons {
            position: absolute;
            top: 46%;
            left: 10%;
            width: 15%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 48%;
        }

        #selector {
            position: absolute;
            left: -25%;
            width: 20%;
            transition: top 0.1s;
            pointer-events: none;
        }

        /* Image buttons (New Game) */
        img.menu-btn {
            width: 100%;
            cursor: pointer;
            display: block;
        }
        img.menu-btn:hover { opacity: 0.7; }

        /* Continue row — image + night label side by side */
        .continue-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .continue-row:hover { opacity: 0.7; }
        #continue-night {
            font-family: 'FNAF', 'Courier New', monospace;
            font-size: clamp(40px, 8vw, 112px);
            color: #ffffff;
            letter-spacing: 0.04em;
            white-space: nowrap;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.95);
        }

        /* Text buttons (Leaderboard, Login) — same visual weight as image buttons */
        .menu-btn-text {
            font-family: 'FNAF', 'Courier New', monospace;
            font-size: clamp(40px, 8vw, 112px);
            color: #ffffff;
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
            padding: 0;
            letter-spacing: 0.04em;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.95);
            white-space: nowrap;
            display: block;
        }
        .menu-btn-text:hover { opacity: 0.7; }


        @keyframes slideDown {
            from {
                bottom: 100%;
            }
            to {
                top: 90%;
            }
        }

        #transition-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        #transition-overlay {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: black;
            opacity: 0;
            transition: opacity 0.7s ease;
        }

        #page-fade {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index:1;
            transition: opacity 0.6s ease;
        }

        /* ── Login button ──────────────────────────────────────── */
        @font-face {
            font-family: 'FNAF';
            src: url('../../assets/Fonts/five-nights-at-freddys.otf') format('opentype');
        }

    </style>
</head>

<body>

<div id="page-fade"></div>

<div class="container">
    <img id="anim" src="../../assets/Menu/1.png">
    <img id="animNoiseMenu" src="../../assets/Menu/staticNoise1.png">
    <img id="animWhiteMenu" src="../../assets/Menu/whiteNoise1.png">
    <img class="slide" src="../../assets/Menu/452.png">
    <img id="title" class="FNAFtitle" src="../../assets/Menu/444-trans.png">
    <div class="menu-buttons">
        <img id="selector" src="../../assets/Menu/arrow_trans.png">
        <button class="menu-btn menu-btn-text" onclick="onNewGame()">New Game</button>
        <div id="continue-row" class="continue-row menu-btn" onclick="onContinue()">
            <span class="menu-btn-text" style="display:inline;">Continue</span>
            <span id="continue-night"></span>
        </div>
        <button id="custom-night-btn" class="menu-btn menu-btn-text" onclick="goToCustomNight()" style="display:none;">Custom Night</button>
        <button class="menu-btn menu-btn-text" onclick="goToLeaderboard()">Leaderboard</button>
        <button id="login-btn" class="menu-btn menu-btn-text" onclick="goToLogin()">Log Out</button>
    </div>
</div>

<!-- Connected user display — bottom left -->
<div id="user-display" style="
    display: none;
    position: fixed;
    bottom: 24px;
    left: 24px;
    font-family: 'FNAF', 'Courier New', monospace;
    font-size: clamp(13px, 1.6vw, 20px);
    color: #ffffff;
    letter-spacing: 0.08em;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
    z-index: 20;
    pointer-events: none;
"></div>

<!-- Full-screen transition overlay -->
<div id="transition-overlay">
    <img id="transition-img" src="../../assets/Menu/574.png">
</div>


<script>

    function fadeTo(el, from, to, duration) {
        return new Promise(resolve => {
            el.style.transition = `opacity ${duration}ms ease`;
            el.style.opacity = from;
            void el.offsetWidth;
            el.style.opacity = to;
            setTimeout(resolve, duration);
        });
    }

    function wait(ms) {
        return new Promise(r => setTimeout(r, ms));
    }

    function goTo(url) {
        document.body.style.transition = "opacity 2s";
        document.body.style.opacity = "0";
        setTimeout(() => {
            window.location.href = '/mainroom';
        }, 2000);
    }

    const API = '%VITE_API_URL%';
    let __furthestNight = 0;

    async function onNewGame() {
        await fetch(`${API}/graphql`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: 'mutation { resetProgress { furthestNight } }' }),
        }).catch(() => {});

        const overlay = document.getElementById('transition-overlay');
        const img     = document.getElementById('transition-img');
        overlay.classList.add('active');
        await fadeTo(overlay, 0, 1, 700);
        await fadeTo(img, 0, 1, 800);
        await wait(3500);
        await fadeTo(img, 1, 0, 800);
        await wait(500);
        window.location.href = '/mainroom';
    }

    async function onContinue() {
        const startNight = __furthestNight > 0 ? __furthestNight + 1 : 1;
        const capped     = Math.min(startNight, 6);
        window.location.href = `/mainroom?night=${capped}`;
    }

    async function goToLogin() {
        await fetch(`${API}/api/auth/logout`, { method: 'POST', credentials: 'include' }).catch(() => {});
        document.body.style.transition = "opacity 0.8s";
        document.body.style.opacity = "0";
        setTimeout(() => { window.location.href = '/login'; }, 800);
    }

    function goToCustomNight() {
        const sfx = new Audio('../../assets/FNaF 1 Audio/CAMERA_VIDEO_LOA_60105303.wav');
        sfx.play().catch(() => {});
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:all;background:#fff;opacity:0;';
        document.body.appendChild(overlay);
        const flickers = [0.9, 0, 0.7, 0, 1, 0, 0.5, 0.8, 0, 1];
        let i = 0;
        const flicker = setInterval(() => {
            overlay.style.opacity = flickers[i] ?? 0;
            i++;
            if (i >= flickers.length) {
                clearInterval(flicker);
                overlay.style.transition = 'opacity 0.3s';
                overlay.style.background = '#000';
                overlay.style.opacity = '1';
                setTimeout(() => { window.location.href = '/customnight'; }, 350);
            }
        }, 60);
    }

    function goToLeaderboard() {
        // TV channel-switch: camera sound + rapid static flash
        const sfx = new Audio('../../assets/FNaF 1 Audio/CAMERA_VIDEO_LOA_60105303.wav');
        sfx.play().catch(() => {});

        const overlay = document.createElement('div');
        overlay.style.cssText = `
            position:fixed; inset:0; z-index:9999; pointer-events:all;
            background:#fff; opacity:0;
        `;
        document.body.appendChild(overlay);

        // Rapid static flicker
        const flickers = [0.9, 0, 0.7, 0, 1, 0, 0.5, 0.8, 0, 1];
        let i = 0;
        const flicker = setInterval(() => {
            overlay.style.opacity = flickers[i] ?? 0;
            i++;
            if (i >= flickers.length) {
                clearInterval(flicker);
                // Fade to black then navigate
                overlay.style.transition = 'opacity 0.3s';
                overlay.style.background = '#000';
                overlay.style.opacity = '1';
                setTimeout(() => { window.location.href = '/leaderboard'; }, 350);
            }
        }, 60);
    }
</script>

<script src="../data/animations.js"></script>
<script src="../pages/player.js"></script>

<script>
    window.onload = async () => {
        document.body.style.opacity = "1";

        // Show/hide continue based on progress
        function updateContinueBtn() {
            const row = document.getElementById('continue-row');
            const nightLabel = document.getElementById('continue-night');
            if (__furthestNight === 0) {
                row.style.display = 'none';
            } else {
                row.style.display = 'flex';
                const next = Math.min(__furthestNight + 1, 6);
                nightLabel.textContent = `Night ${next}`;
            }
        }
        updateContinueBtn();

        // Load connected user info (cookie-based)
        try {
            const res = await fetch(`${API}/api/auth/me`, { credentials: 'include' });
            if (!res.ok) {
                window.location.href = '/unauthorized';
                return;
            }
            if (res.ok) {
                const data = await res.json();
                __furthestNight = data.furthestNight || 0;
                updateContinueBtn();
                const el = document.getElementById('user-display');
                el.textContent = `Connected as: ${data.username}`;
                el.style.display = 'block';
                if (__furthestNight >= 5) {
                    document.getElementById('custom-night-btn').style.display = 'block';
                }
            }
        } catch (e) {
            window.location.href = '/unauthorized';
        }

        const a = new Audio('../../assets/FNaF 1 Audio/darkness music.wav');
        const b = new Audio('../../assets/FNaF 1 Audio/static2.wav');
        a.loop = true
        b.loop = true
        b.play()
            .then(() => console.log("Menu audio playing"))
            .catch((e) => console.error("Menu audio not found", e));
        a.play()
            .then(() => console.log("Menu audio playing"))
            .catch((e) => console.error("Menu audio not found", e));
    }

</script>

<script>
    const selector = document.getElementById("selector");
    let selectedIndex = 0;

    function getVisibleButtons() {
        return Array.from(document.querySelectorAll(".menu-btn")).filter(
            b => b.style.display !== 'none'
        );
    }

    function moveSelector(index) {
        const buttons = getVisibleButtons();
        if (!buttons.length) return;
        selectedIndex = (index + buttons.length) % buttons.length;
        const btn = buttons[selectedIndex];
        selector.style.top = btn.offsetTop + btn.offsetHeight / 2 - selector.offsetHeight / 2 + "px";
    }

    // Attach hover listeners (re-derive index from visible list)
    document.querySelectorAll(".menu-btn").forEach((btn) => {
        btn.addEventListener("mouseenter", () => {
            const visible = getVisibleButtons();
            const i = visible.indexOf(btn);
            if (i >= 0) moveSelector(i);
        });
    });

    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown") moveSelector(selectedIndex + 1);
        if (e.key === "ArrowUp")   moveSelector(selectedIndex - 1);
        if (e.key === "Enter")     getVisibleButtons()[selectedIndex]?.click();
    });

    moveSelector(0);
</script>
