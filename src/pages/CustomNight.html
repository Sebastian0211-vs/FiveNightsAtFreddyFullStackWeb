<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <base href="/src/pages/">
    <title>Custom Night</title>
    <style>
        @font-face {
            font-family: 'FNAF';
            src: url('../../assets/Fonts/five-nights-at-freddys.otf') format('opentype');
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            opacity: 0;
            transition: opacity 1s;
            position: relative;
            overflow: hidden;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            aspect-ratio: 16/9;
        }

        /* Chica background */
        #bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.5);
        }

        /* Noise overlays */
        #animNoise {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 20;
            object-fit: contain;
            pointer-events: none;
        }

        #animWhite {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 21;
            object-fit: contain;
            pointer-events: none;
        }

        /* Slide strip */
        .slide {
            position: fixed;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            opacity: 0.5;
            z-index: 22;
            animation: slideDown 10s linear forwards;
        }

        @keyframes slideDown {
            from { top: -100%; }
            to   { top: 90%;   }
        }

        /* Fade-in overlay */
        #page-fade {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #000;
            opacity: 1;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        /* Title */
        #title {
            position: absolute;
            top: 7%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            font-family: 'FNAF', monospace;
            font-size: 4vw;
            color: #ffffff;
            text-shadow: 2px 2px 12px rgba(0,0,0,0.95);
            white-space: nowrap;
            pointer-events: none;
        }

        /* Back button */
        #back-btn {
            position: fixed;
            top: 24px;
            left: 28px;
            z-index: 30;
            font-family: 'FNAF', monospace;
            font-size: clamp(12px, 1.4vw, 20px);
            color: #ffffff;
            background: none;
            border: none;
            cursor: pointer;
            letter-spacing: 0.05em;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.9);
            white-space: nowrap;
        }
        #back-btn:hover { opacity: 0.7; }

        /* Main content — centers the cards+legend as a unit */
        .main-content {
            position: absolute;
            top: 17%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: clamp(10px, 2vh, 24px);
        }

        /* 4-column grid */
        .animatronics {
            display: flex;
            gap: clamp(20px, 4vw, 60px);
            align-items: flex-start;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(6px, 0.8vh, 12px);
        }

        .card-name {
            font-family: 'FNAF', monospace;
            font-size: clamp(12px, 2vw, 28px);
            color: #ffffff;
            letter-spacing: 0.06em;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.9);
        }

        .card-portrait {
            width: clamp(80px, 13vw, 190px);
            height: clamp(80px, 13vw, 190px);
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.15);
        }

        .ai-label {
            font-family: 'FNAF', monospace;
            font-size: clamp(9px, 1.3vw, 18px);
            color: #ffffff;
            letter-spacing: 0.06em;
            margin-top: 4px;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.9);
        }

        .ai-control {
            display: flex;
            align-items: center;
            gap: clamp(10px, 1.5vw, 24px);
        }

        .ai-btn {
            font-family: 'FNAF', monospace;
            font-size: clamp(14px, 2.2vw, 32px);
            color: #ffffff;
            background: none;
            border: none;
            cursor: pointer;
            line-height: 1;
            padding: 0 4px;
            user-select: none;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.9);
        }
        .ai-btn:hover { opacity: 0.6; }
        .ai-btn:active { transform: scale(0.9); }

        .ai-value {
            font-family: 'FNAF', monospace;
            font-size: clamp(14px, 2.4vw, 34px);
            color: #ffffff;
            min-width: 2ch;
            text-align: center;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.9);
        }

        /* Difficulty legend */
        #legend {
            font-family: 'FNAF', monospace;
            font-size: clamp(28px, 4vw, 54px);
            color: rgba(255,255,255,0.65);
            letter-spacing: 0.06em;
            white-space: nowrap;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.9);
        }

        /* READY button */
        #ready-btn {
            position: absolute;
            bottom: 6%;
            right: 4%;
            z-index: 25;
            font-family: 'FNAF', monospace;
            font-size: clamp(12px, 2vw, 28px);
            color: #111;
            background: #ffffff;
            border: none;
            padding: 0.4em 1em;
            cursor: pointer;
            letter-spacing: 0.1em;
        }
        #ready-btn:hover { background: #ccc; }
        #ready-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

<div id="page-fade"></div>

<div class="container">
    <img id="bg" src="../../assets/Custom/Chica_menu.png">
    <img id="animNoise" src="../../assets/Menu/staticNoise1.png">
    <img id="animWhite" src="../../assets/Menu/whiteNoise1.png">
    <img class="slide"  src="../../assets/Menu/452.png">

    <div id="title">Customize Night</div>

    <div class="main-content">
        <div class="animatronics">

            <div class="card">
                <span class="card-name">Freddy</span>
                <img class="card-portrait" src="../../assets/Icons/527.png" alt="Freddy">
                <span class="ai-label">A.I. Level</span>
                <div class="ai-control">
                    <button class="ai-btn" onclick="change('freddy',-1)">&#60;</button>
                    <span class="ai-value" id="val-freddy">0</span>
                    <button class="ai-btn" onclick="change('freddy', 1)">&#62;</button>
                </div>
            </div>

            <div class="card">
                <span class="card-name">Bonnie</span>
                <img class="card-portrait" src="../../assets/Icons/528.png" alt="Bonnie">
                <span class="ai-label">A.I. Level</span>
                <div class="ai-control">
                    <button class="ai-btn" onclick="change('bonnie',-1)">&#60;</button>
                    <span class="ai-value" id="val-bonnie">0</span>
                    <button class="ai-btn" onclick="change('bonnie', 1)">&#62;</button>
                </div>
            </div>

            <div class="card">
                <span class="card-name">Chica</span>
                <img class="card-portrait" src="../../assets/Icons/529.png" alt="Chica">
                <span class="ai-label">A.I. Level</span>
                <div class="ai-control">
                    <button class="ai-btn" onclick="change('chica',-1)">&#60;</button>
                    <span class="ai-value" id="val-chica">0</span>
                    <button class="ai-btn" onclick="change('chica', 1)">&#62;</button>
                </div>
            </div>

            <div class="card">
                <span class="card-name">Foxy</span>
                <img class="card-portrait" src="../../assets/Icons/536.png" alt="Foxy">
                <span class="ai-label">A.I. Level</span>
                <div class="ai-control">
                    <button class="ai-btn" onclick="change('foxy',-1)">&#60;</button>
                    <span class="ai-value" id="val-foxy">0</span>
                    <button class="ai-btn" onclick="change('foxy', 1)">&#62;</button>
                </div>
            </div>

        </div>

        <div id="legend">(0-2)easy &nbsp; (3-6)med &nbsp; (7-12)hard &nbsp; (12+)extreme</div>
    </div>

    <button id="ready-btn" onclick="startNight()">READY</button>
</div>

<button id="back-btn" onclick="goToMenu()">Back to Menu</button>

<script src="../data/animations.js"></script>
<script src="../pages/player.js"></script>

<script>
    const levels = { freddy: 0, bonnie: 0, chica: 0, foxy: 0 };
    const bgAudio = [];

    function change(name, delta) {
        levels[name] = Math.max(0, Math.min(20, levels[name] + delta));
        document.getElementById('val-' + name).textContent = levels[name];
    }

    function tvStaticTo(url) {
        const sfx = new Audio('../../assets/FNaF 1 Audio/CAMERA_VIDEO_LOA_60105303.wav');
        sfx.play().catch(() => {});
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:all;background:#fff;opacity:0;';
        document.body.appendChild(overlay);
        const flickers = [0.9, 0, 0.7, 0, 1, 0, 0.5, 0.8, 0, 1];
        let i = 0;
        const flicker = setInterval(() => {
            overlay.style.opacity = flickers[i] ?? 0;
            i++;
            if (i >= flickers.length) {
                clearInterval(flicker);
                overlay.style.transition = 'opacity 0.3s';
                overlay.style.background = '#000';
                overlay.style.opacity = '1';
                setTimeout(() => { window.location.href = url; }, 350);
            }
        }, 60);
    }

    function goToMenu()   { tvStaticTo('/menu'); }
    function startNight() {
        // 1-9-8-7 Easter egg — Golden Freddy
        if (levels.freddy === 1 && levels.bonnie === 9 && levels.chica === 8 && levels.foxy === 7) {
            triggerGoldenFreddy();
            return;
        }
        sessionStorage.setItem('__customNight', JSON.stringify(levels));
        tvStaticTo('/mainroom');
    }

    function triggerGoldenFreddy() {
        // Silence background audio
        bgAudio.forEach(a => { a.pause(); a.currentTime = 0; });

        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:9999;';
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        document.body.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        const sfx = new Audio('../../assets/FNaF 1 Audio/XSCREAM2.wav');
        sfx.play().catch(() => {});

        const frames = goldenFreddyJumpscare.frames.map(src => {
            const img = new Image(); img.src = src; return img;
        });
        const msPerFrame = 1000 / goldenFreddyJumpscare.fps;
        let frameIdx = 0;

        function nextFrame() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);
            const img = frames[frameIdx];
            if (img.naturalWidth) {
                const sc = Math.max(W / img.naturalWidth, H / img.naturalHeight);
                const dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;
                ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
            }
            frameIdx++;
            if (frameIdx < frames.length) setTimeout(nextFrame, msPerFrame);
        }
        nextFrame();

        // Redirect to menu after 2s
        setTimeout(() => { window.location.href = '/menu'; }, 2000);
    }

    window.onload = () => {
        document.body.style.opacity = '1';
        const fade = document.getElementById('page-fade');
        setTimeout(() => { fade.style.opacity = '0'; }, 50);

        const sfxStatic = new Audio('../../assets/FNaF 1 Audio/static2.wav');
        sfxStatic.loop = true;
        sfxStatic.play().catch(() => {});
        bgAudio.push(sfxStatic);

        const music = new Audio('../../assets/Custom/Unraveled - Feldup.mp3');
        music.loop = true;
        music.play().catch(() => {});
        bgAudio.push(music);

        playNoise(document.getElementById('animNoise'), noiseMenu, 0.4);
        playNoise(document.getElementById('animNoise'), noiseMenu);
        playAnimation(document.getElementById('animWhite'), whiteMenu, 0.4);

        const slide = document.querySelector('.slide');
        slide.addEventListener('animationend', () => {
            slide.style.animation = 'none';
            void slide.offsetWidth;
            slide.style.animation = 'slideDown 10s linear forwards';
        });
    };
</script>

</body>
</html>
