<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <base href="/src/pages/">
    <title>Unauthorized</title>
    <style>
        @font-face {
            font-family: 'FNAF';
            src: url('../../assets/Fonts/five-nights-at-freddys.otf') format('opentype');
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            opacity: 0;
            transition: opacity 1.2s;
        }

        /* Full-screen canvas for the jumpscare (hidden until triggered) */
        #js-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            display: none;
        }

        /* UI layer */
        #ui {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #gf-img {
            width: clamp(200px, 28vw, 420px);
            object-fit: contain;
            opacity: 0.55;
            filter: brightness(0.8);
        }

        #msg {
            font-family: 'FNAF', monospace;
            color: #ffffff;
            font-size: clamp(18px, 2.5vw, 36px);
            letter-spacing: 0.1em;
            text-align: center;
            margin-top: 40px;
            text-shadow: 0 0 18px rgba(255,255,255,0.25);
        }

        #sub-msg {
            font-family: 'FNAF', monospace;
            color: rgba(255,255,255,0.4);
            font-size: clamp(10px, 1.1vw, 16px);
            letter-spacing: 0.12em;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<canvas id="js-canvas"></canvas>

<div id="ui">
    <img id="gf-img" src="../../assets/Golden Freddy/573.png" alt="">
    <p id="msg">Unauthorized Entry</p>
    <p id="sub-msg">Redirecting to login...</p>
</div>

<!-- Load animation definitions (goldenFreddyJumpscare, noiseMenu, etc.) -->
<script src="../data/animations.js"></script>

<script>
    const SCARE_AT      = 7000;
    const REDIRECT_AT   = 10000;

    window.onload = () => { document.body.style.opacity = '1'; };

    // Countdown
    let remaining = Math.round(REDIRECT_AT / 1000);
    const subMsg = document.getElementById('sub-msg');
    const countInterval = setInterval(() => {
        remaining--;
        if (remaining > 0) subMsg.textContent = `Redirecting to login in ${remaining}s...`;
    }, 1000);

    // Canvas-based jumpscare (mirrors the engine in jumpscare.js but self-contained)
    function runJumpscare(def, sfxSrc, onDone, maxDurationMs) {
        const canvas = document.getElementById('js-canvas');
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.style.display = 'block';

        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        const sfx = new Audio(sfxSrc);
        sfx.currentTime = 0;
        sfx.play().catch(() => {});

        const msPerFrame = 1000 / def.fps;
        let finished = false;

        const frames = def.frames.map(src => {
            const img = new Image();
            img.src = src;
            return img;
        });

        function finish() {
            if (finished) return;
            finished = true;
            sfx.pause();
            if (onDone) onDone();
        }

        if (maxDurationMs != null) setTimeout(finish, maxDurationMs);

        let frameIdx = 0;
        function nextFrame() {
            if (finished) return;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);
            const img = frames[frameIdx];
            if (img.naturalWidth) {
                const sc = Math.max(W / img.naturalWidth, H / img.naturalHeight);
                const dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;
                ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
            }
            frameIdx++;
            if (frameIdx < frames.length) {
                setTimeout(nextFrame, msPerFrame);
            } else {
                finish();
            }
        }
        nextFrame();
    }

    // Fire jumpscare at 7s
    setTimeout(() => {
        document.getElementById('ui').style.display = 'none';
        runJumpscare(
            goldenFreddyJumpscare,
            '../../assets/FNaF 1 Audio/XSCREAM2.wav',
            null,
            1000
        );
    }, SCARE_AT);

    // Redirect at 10s
    setTimeout(() => {
        clearInterval(countInterval);
        window.location.href = '/login';
    }, REDIRECT_AT);
</script>
</body>
</html>
