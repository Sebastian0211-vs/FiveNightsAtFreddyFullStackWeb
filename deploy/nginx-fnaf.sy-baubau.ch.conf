# /etc/nginx/sites-available/fnaf.sy-baubau.ch
# Same-origin: React SPA (built to dist/) + API/GraphQL proxied to Node on :3002,
# with the standalone game page served RAW from source (classic <script> engine).
# Reuses the existing Let's Encrypt cert for fnaf.sy-baubau.ch.

server {
    server_name fnaf.sy-baubau.ch;

    root  /var/www/fnaf/dist;
    index index.html;
    client_max_body_size 10m;

    # --- API + GraphQL -> Node ---
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /graphql {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Raw game assets (audio / images / fonts). Linux is case-sensitive,
    #     and the code references both casings, so serve both. ---
    location /assets/ { alias /var/www/fnaf/assets/; access_log off; expires 30d; }
    location /Assets/ { alias /var/www/fnaf/Assets/; access_log off; expires 30d; }

    # --- Standalone game: page + its raw engine scripts (not Vite-bundled) ---
    location = /mainroom { return 302 /src/pages/MainRoom.html$is_args$args; }
    location /src/ { root /var/www/fnaf; expires 1h; }

    # --- Vite bundle output (hashed, immutable) lives in dist/bundle ---
    location /bundle/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # --- React SPA fallback (client-side routes: /login /menu /play /leaderboard ...) ---
    location / { try_files $uri $uri/ /index.html; }

    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/fnaf.sy-baubau.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fnaf.sy-baubau.ch/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP -> HTTPS redirect
server {
    if ($host = fnaf.sy-baubau.ch) { return 301 https://$host$request_uri; }
    listen 80;
    server_name fnaf.sy-baubau.ch;
    return 404;
}
